<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCILLASDOTTER</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0A0B">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; form-action 'none'; base-uri 'self'; upgrade-insecure-requests">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="icon" href="/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
<script src="/poort.js"></script>
<style>
  .poort-vel{
    min-height:100vh;box-sizing:border-box;background:#0A0A0B;
    display:flex;align-items:center;justify-content:center;
    padding:96px 20px;position:relative;
    font-family:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  .poort-merk{
    position:absolute;top:32px;left:0;right:0;text-align:center;
    font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#F4F3F0;
  }
  .poort-plaats{
    position:absolute;bottom:32px;left:0;right:0;text-align:center;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#4A4A4F;
  }
  .poort-blok{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center}
  .poort-streep{width:48px;height:1px;background:#4A4A4F}
  .poort-kop{
    margin:28px 0 0;font-family:"Bodoni Moda",Didot,"Times New Roman",serif;
    font-size:34px;font-weight:400;line-height:1.15;color:#F4F3F0;text-align:center;
  }
  .poort-uitleg{margin:16px 0 0;max-width:320px;font-size:15px;line-height:1.65;color:#A3A19A;text-align:center}
  .poort-velden{width:100%;display:flex;flex-direction:column;gap:24px;margin-top:44px}
  .poort-regel{display:flex;flex-direction:column;gap:6px}
  .poort-etiket{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#82807A}
  .poort-veld{
    width:100%;box-sizing:border-box;background:transparent;border:0;
    border-bottom:1px solid #4A4A4F;border-radius:0;padding:11px 0;color:#F4F3F0;
    font-family:inherit;font-size:17px;letter-spacing:.02em;outline:none;
    transition:border-color .2s ease;
  }
  .poort-veld:focus{border-bottom-color:#F4F3F0}
  .poort-fout{
    margin:22px 0 0;width:100%;font-size:13px;line-height:1.5;color:#F4F3F0;
    border-left:1px solid #4A4A4F;padding-left:12px;
  }
  .poort-knop{
    width:100%;box-sizing:border-box;margin-top:40px;background:transparent;
    border:1px solid #4A4A4F;color:#F4F3F0;font-family:inherit;
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    padding:16px 20px;cursor:pointer;
    transition:background .2s ease,color .2s ease,border-color .2s ease;
  }
  .poort-knop:hover,.poort-knop:focus-visible{background:#F4F3F0;color:#0A0A0B;border-color:#F4F3F0}
  .poort-voet{margin:28px 0 0;font-size:12px;line-height:1.6;color:#82807A;text-align:center}
  .poort-voet a{color:#A3A19A}
  .poort-voet a:hover{color:#F4F3F0}
  @media (min-width:768px){ .poort-kop{font-size:42px} .poort-merk{font-size:15px} }
  @media (prefers-reduced-motion:reduce){ .poort-veld,.poort-knop{transition:none} }
</style>
</head>
<body>
<div class="poort-vel">

  <span class="poort-merk">Scillasdotter</span>

  <form class="poort-blok" id="poort-formulier" novalidate>
    <span class="poort-streep"></span>

    <h1 class="poort-kop">By invitation</h1>
    <p class="poort-uitleg">The atelier's site is private for the moment. Sign in to continue.</p>

    <div class="poort-velden">
      <div class="poort-regel">
        <label class="poort-etiket" for="poort-gebruiker">Username</label>
        <input class="poort-veld" id="poort-gebruiker" name="username" type="text"
               autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      </div>
      <div class="poort-regel">
        <label class="poort-etiket" for="poort-sleutel">Password</label>
        <input class="poort-veld" id="poort-sleutel" name="password" type="password"
               autocomplete="current-password">
      </div>
    </div>

    <p class="poort-fout" id="poort-fout" role="alert" hidden>That combination is not on the list. Try again.</p>

    <button class="poort-knop" type="submit">Enter</button>

    <p class="poort-voet">No access yet? Write to us at <a href="mailto:couture@scillasdotter.com">couture@scillasdotter.com</a></p>
  </form>

  <span class="poort-plaats">Amsterdam</span>

</div>
</body>
</html>
